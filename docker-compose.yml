services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: briathra
      POSTGRES_PASSWORD: briathra
      POSTGRES_DB: briathra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briathra"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
